<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#401c14"/>

  <!-- Subtle texture overlay -->
  <rect width="1200" height="630" fill="url(#grad)" opacity="0.15"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8501d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#401c14;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Orange accent line -->
  <rect x="80" y="460" width="120" height="4" rx="2" fill="#e8501d"/>

  <!-- Church name -->
  <text x="80" y="340" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="white" letter-spacing="1">Comunidad de</text>
  <text x="80" y="420" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="white" letter-spacing="1">Amor Cristiano</text>

  <!-- Tagline -->
  <text x="80" y="500" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.65)" letter-spacing="0.5">Iglesia cristiana en Córdoba</text>

  <!-- Flame logo (right side) -->
  <image href="/images/logo-llama.png" x="820" y="80" width="300" height="430" opacity="0.9"/>

  <!-- Website -->
  <text x="80" y="580" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.4)">iglesiacac.es</text>
</svg>
